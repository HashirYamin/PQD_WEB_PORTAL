services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pqd_portal
      POSTGRES_USER: pqd_user
      POSTGRES_PASSWORD: pqd_password
    ports:
      - "5432:5432"
    volumes:
      - pqd_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pqd_user -d pqd_portal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pqd_postgres_data:
